services:
  - type: web
    name: interviewace-api
    runtime: node
    rootDir: server
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AWS_REGION
        sync: false
      - key: DYNAMODB_INTERVIEWS_TABLE
        sync: false
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_USER_POOL_CLIENT_ID
        sync: false
      - key: FRONTEND_URLS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
